<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .game-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .game-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
        }

        .game-description {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
            line-height: 1.4;
        }

        .play-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            font-weight: bold;
        }

        .play-button:hover {
            background: #45a049;
            transform: scale(1.1);
        }

        .age-badge {
            display: inline-block;
            background: #FFD700;
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            .games-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Fun Learning Games 🎮</h1>

        <div class="games-grid">
            <!-- Typing Game -->
            <div class="game-card">
                <div class="game-icon">⌨️</div>
                <h2 class="game-title">Typing Game</h2>
                <div class="age-badge">All Ages</div>
                <p class="game-description">
                    Practice your typing skills with fun words!
                    Three difficulty levels to choose from.
                </p>
                <a href="typing-game/index.html" class="play-button">Play Game</a>
            </div>

            <!-- Math Facts -->
            <div class="game-card">
                <div class="game-icon">✖️</div>
                <h2 class="game-title">Math Facts</h2>
                <div class="age-badge">All Ages</div>
                <p class="game-description">
                    Practice your times tables one problem at a time!
                    See a grid of which facts you already know by heart.
                </p>
                <a href="math-game/index.html" class="play-button">Play Game</a>
            </div>
        </div>
    </div>
</body>
</html>
